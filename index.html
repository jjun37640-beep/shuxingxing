    .leather-plaque {
      background: radial-gradient(ellipse at 50% 30%, #1e2c40 0%, #121c2b 65%, #0a111a 100%);
      box-shadow: 
        0 18px 38px -10px rgba(8, 14, 24, 0.65),
        0 4px 12px rgba(0, 0, 0, 0.4),
        inset 0 1px 2px rgba(255, 255, 255, 0.15),
        inset 0 -2px 4px rgba(0, 0, 0, 0.6);
      position: relative;

    /* Gold foil inner frame */

      border: 2px solid transparent;
      border-image: linear-gradient(135deg, #dfba73 0%, #fae8b6 25%, #a67c2e 50%, #fdf0cd 75%, #8b651b 100%) 2;
      box-shadow: 
        0 0 1px rgba(0,0,0,0.8),
        inset 0 0 6px rgba(0,0,0,0.6);
    }

    /* Vertical Lyrics Scroll Viewport */
    .lyrics-container {
      scroll-behavior: smooth;
      -webkit-mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 0, 0, 0.85) 18%, 
        black 35%, 
        black 65%, 
        rgba(0, 0, 0, 0.85) 82%, 
        transparent 100%);
      mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 0, 0, 0.85) 18%, 
        black 35%, 
        black 65%, 
        rgba(0, 0, 0, 0.85) 82%, 
        transparent 100%);
    }

    .lyric-item {
      transition: all 0.38s cubic-bezier(0.2, 0.8, 0.25, 1);
      cursor: pointer;
    }

    .lyric-item.inactive {
      opacity: 0.38;
      filter: blur(0.3px);
      transform: scale(0.96);
    }

    .lyric-item.inactive:hover {
      opacity: 0.8;
      filter: blur(0);
      transform: scale(0.99);
    }

    .lyric-item.active {
      opacity: 1;
      filter: blur(0);
      transform: scale(1.05);
      text-shadow: 0 0 16px rgba(251, 191, 36, 0.45);
    }

    /* Metallic Gold Text */
    .text-gold-gradient {
      background: linear-gradient(135deg, #fff7d6 0%, #fed876 50%, #caa44c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Pinyin (Ruby Annotation) Typography */
    ruby {
      ruby-align: center;
    }
    rt {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.52em;
      line-height: 1;
      letter-spacing: -0.01em;
      color: #dfba73;
      user-select: none;
      font-weight: 500;
      opacity: 0.85;
      padding-bottom: 2px;
    }
    .lyric-item.active rt {
      color: #fef08a;
      opacity: 1;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }
    .pinyin-hidden rt {
      display: none;
    }

    /* Hide standard scrollbar for immersive lyric view */
    .lyrics-container::-webkit-scrollbar {
      display: none;
    }

      -ms-overflow-style: none;
      scrollbar-width: none;
    }

      width: 6px; height: 6px; border-radius: 9999px;
      background: #34d399; box-shadow: 0 0 6px rgba(52, 211, 153, 0.8);
      display: inline-block;
    }

    // 14 Calibrated sentences with verified timestamps & pinyin annotations
    const sentences = [
      {

        text: "晚上，满天的星星像无数珍珠撒在碧玉盘里。",
        pinyinHtml: "<ruby>晚<rt>wǎn</rt></ruby><ruby>上<rt>shang</rt></ruby>，<ruby>满<rt>mǎn</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>的<rt>de</rt></ruby><ruby>星<rt>xīng</rt></ruby><ruby>星<rt>xing</rt></ruby><ruby>像<rt>xiàng</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>数<rt>shù</rt></ruby><ruby>珍<rt>zhēn</rt></ruby><ruby>珠<rt>zhū</rt></ruby><ruby>撒<rt>sǎ</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>碧<rt>bì</rt></ruby><ruby>玉<rt>yù</rt></ruby><ruby>盘<rt>pán</rt></ruby><ruby>里<rt>lǐ</rt></ruby>。" 
      },
      { 
        id: 2, start: 5.010, end: 8.960, duration: "3.95s", 
        text: "一个孩子坐在院子里，靠着奶奶，仰起头。",
        pinyinHtml: "<ruby>一<rt>yí</rt></ruby><ruby>个<rt>gè</rt></ruby><ruby>孩<rt>hái</rt></ruby><ruby>子<rt>zi</rt></ruby><ruby>坐<rt>zuò</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>院<rt>yuàn</rt></ruby><ruby>子<rt>zi</rt></ruby><ruby>里<rt>lǐ</rt></ruby>，<ruby>靠<rt>kào</rt></ruby><ruby>着<rt>zhe</rt></ruby><ruby>奶<rt>nǎi</rt></ruby><ruby>奶<rt>nai</rt></ruby>，<ruby>仰<rt>yǎng</rt></ruby><ruby>起<rt>qǐ</rt></ruby><ruby>头<rt>tóu</rt></ruby>。" 
      },
      { 
        id: 3, start: 9.540, end: 14.270, duration: "4.73s", 
        text: "指着天空数星星，一颗、两颗……一直数到了几百颗。",
        pinyinHtml: "<ruby>指<rt>zhǐ</rt></ruby><ruby>着<rt>zhe</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>空<rt>kōng</rt></ruby><ruby>数<rt>shǔ</rt></ruby><ruby>星<rt>xīng</rt></ruby><ruby>星<rt>xing</rt></ruby>，<ruby>一<rt>yì</rt></ruby><ruby>颗<rt>kē</rt></ruby>、<ruby>两<rt>liǎng</rt></ruby><ruby>颗<rt>kē</rt></ruby>……<ruby>一<rt>yì</rt></ruby><ruby>直<rt>zhí</rt></ruby><ruby>数<rt>shǔ</rt></ruby><ruby>到<rt>dào</rt></ruby><ruby>了<rt>le</rt></ruby><ruby>几<rt>jǐ</rt></ruby><ruby>百<rt>bǎi</rt></ruby><ruby>颗<rt>kē</rt></ruby>。"

      {

    // 实测该 MP3 时长为 88.163 秒（3375 帧 @44100Hz），与最后一句结束点一致
    const TOTAL_AUDIO_DURATION = 88.163;

    // DOM Elements
    const audio = document.getElementById('audioPlayer');
    const audioFileInput = document.getElementById('audioFileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadBtnText = document.getElementById('uploadBtnText');
    const audioFileName = document.getElementById('audioFileName');
    const audioLoadState = document.getElementById('audioLoadState');
    const audioDownloadLink = document.getElementById('audioDownloadLink');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressBar = document.getElementById('progressBar');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const totalDurationDisplay = document.getElementById('totalDurationDisplay');
    const lyricsContainer = document.getElementById('lyricsContainer');
    const sentenceGlowFill = document.getElementById('sentenceGlowFill');
    const currentStatusBadge = document.getElementById('currentStatusBadge');
    const skipBackBtn = document.getElementById('skipBackBtn');
    const skipForwardBtn = document.getElementById('skipForwardBtn');
    const singleLoopToggleBtn = document.getElementById('singleLoopToggleBtn');
    const loopDot = document.getElementById('loopDot');
    const loopText = document.getElementById('loopText');
    const toggleScrollModeBtn = document.getElementById('toggleScrollModeBtn');
    const togglePinyinBtn = document.getElementById('togglePinyinBtn');

    let isAudioLoaded = false;
    let currentSentenceIndex = -1;
    let isUserSeeking = false;
    let isSingleLoop = false;
    let autoScrollEnabled = true;
    let isPinyinVisible = false;
    let userManualScrollTimeout = null;

    // Format helpers
    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(4, '0')}`;
    }

    function formatTimeSRT(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const remainder = sec % 60;
      const s = Math.floor(remainder);
      const ms = Math.floor((remainder - s) * 1000);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')},${String(ms).padStart(3, '0')}`;
    }

    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-4');
      }, 2600);
    }

    // Render the lyrics list inside the Navy Leather Plaque
    function renderLyrics() {
      lyricsContainer.innerHTML = '';

      // Top padding spacer to allow first sentence to align center
      const topSpacer = document.createElement('div');
      topSpacer.className = "h-[110px] sm:h-[130px] flex-shrink-0 pointer-events-none";
      lyricsContainer.appendChild(topSpacer);

      sentences.forEach((sentence, index) => {
        const item = document.createElement('div');
        item.id = `lyric-line-${index}`;
        item.className = "lyric-item inactive py-3 sm:py-4 px-2 sm:px-4 my-1 rounded-xl cursor-pointer select-none";
        item.dataset.index = index;

        item.innerHTML = `
          <div class="flex items-center justify-center gap-2 mb-1 opacity-60 text-[11px] font-mono tracking-wider text-amber-200/80">
            <span>#${String(sentence.id).padStart(2, '0')}</span>
            <span>·</span>
            <span>${formatTime(sentence.start)}</span>
          </div>
          <p class="lyric-text text-base sm:text-lg md:text-xl font-medium tracking-wide text-slate-200 transition-colors duration-200 leading-relaxed font-serif">
            ${sentence.pinyinHtml}
          </p>
        `;

        item.addEventListener('click', () => {
          seekToSentence(index);
        });

        lyricsContainer.appendChild(item);
      });

      // Bottom padding spacer to allow last sentence to align center
      const bottomSpacer = document.createElement('div');
      bottomSpacer.className = "h-[110px] sm:h-[130px] flex-shrink-0 pointer-events-none";
      lyricsContainer.appendChild(bottomSpacer);
    }

    // Scroll active lyric strictly to the vertical center of the plaque window
    function scrollToActiveLyric(index, immediate = false) {
      if (!autoScrollEnabled) return;
      const targetElement = document.getElementById(`lyric-line-${index}`);
      if (!targetElement) return;

      const containerHeight = lyricsContainer.clientHeight;
      const targetOffsetTop = targetElement.offsetTop;
      const targetHeight = targetElement.clientHeight;

      const targetScrollTop = targetOffsetTop - (containerHeight / 2) + (targetHeight / 2);

      lyricsContainer.scrollTo({
        top: targetScrollTop,
        behavior: immediate ? 'auto' : 'smooth'
      });
    }

    // Detect user manual scroll to prevent fighting the auto-scroll
    lyricsContainer.addEventListener('wheel', () => {
      autoScrollEnabled = false;
      toggleScrollModeBtn.classList.remove('bg-amber-500/10', 'text-amber-300', 'border-amber-500/30');
      toggleScrollModeBtn.classList.add('bg-slate-800', 'text-slate-400', 'border-slate-700');
      toggleScrollModeBtn.innerHTML = `<span>⏸ 自由滑动中 (点击恢复)</span>`;
      clearTimeout(userManualScrollTimeout);
      userManualScrollTimeout = setTimeout(() => {
        // Automatically restore auto scroll after 4 seconds of inactivity
        enableAutoScroll();
      }, 4000);
    }, { passive: true });

    function enableAutoScroll() {
      autoScrollEnabled = true;
      toggleScrollModeBtn.classList.add('bg-amber-500/10', 'text-amber-300', 'border-amber-500/30');
      toggleScrollModeBtn.classList.remove('bg-slate-800', 'text-slate-400', 'border-slate-700');
      toggleScrollModeBtn.innerHTML = `<span>🔄 滚屏居中</span>`;
      if (currentSentenceIndex !== -1) {
        scrollToActiveLyric(currentSentenceIndex);
      }
    }

    toggleScrollModeBtn.addEventListener('click', enableAutoScroll);

    // Pinyin visibility toggle handler
    togglePinyinBtn.addEventListener('click', () => {
      isPinyinVisible = !isPinyinVisible;
      if (isPinyinVisible) {
        lyricsContainer.classList.remove('pinyin-hidden');
        togglePinyinBtn.classList.remove('bg-slate-800/80', 'text-slate-300', 'border-slate-700');
        togglePinyinBtn.classList.add('bg-amber-500/20', 'text-amber-300', 'border-amber-500/40');
        togglePinyinBtn.innerHTML = `<span>🔤 拼音: 开</span>`;
        showToast("已开启逐字拼音注音");
      } else {
        lyricsContainer.classList.add('pinyin-hidden');
        togglePinyinBtn.classList.add('bg-slate-800/80', 'text-slate-300', 'border-slate-700');
        togglePinyinBtn.classList.remove('bg-amber-500/20', 'text-amber-300', 'border-amber-500/40');
        togglePinyinBtn.innerHTML = `<span>🔤 拼音: 关</span>`;
        showToast("已关闭拼音注音显示");
      }

      // Re-center active sentence smoothly after line-height recalculation
      if (currentSentenceIndex !== -1) {
        setTimeout(() => scrollToActiveLyric(currentSentenceIndex), 60);
      }
    });

    function highlightSentence(index) {
      currentSentenceIndex = index;

      if (index === -1) {
        currentStatusBadge.textContent = "就绪 · 等待试听";
        sentenceGlowFill.style.width = '0%';
        return;
      }

      const activeSentence = sentences[index];
      currentStatusBadge.innerHTML = `
        <span class="text-amber-300 font-bold">第 ${index + 1} 句</span>
        <span class="text-slate-400 mx-1.5">|</span>
        <span class="font-mono text-amber-200/90">${formatTime(activeSentence.start)} - ${formatTime(activeSentence.end)}</span>
      `;

      // Update styling on all lyric lines
      sentences.forEach((_, idx) => {
        const line = document.getElementById(`lyric-line-${idx}`);
        if (!line) return;
        const textElement = line.querySelector('.lyric-text');

        if (idx === index) {
          line.classList.remove('inactive');
          line.classList.add('active');
          textElement.classList.remove('text-slate-200');
          textElement.classList.add('text-gold-gradient', 'font-bold');
        } else {
          line.classList.add('inactive');
          line.classList.remove('active');
          textElement.classList.add('text-slate-200');
          textElement.classList.remove('text-gold-gradient', 'font-bold');
        }
      });

      scrollToActiveLyric(index);
    }

    function seekToSentence(index) {
      if (!sentences[index]) return;
      const targetTime = sentences[index].start;

      if (!isAudioLoaded) {
        showToast("云端音频尚未就绪，请稍候或更换本地音频");
        return;
      }

      audio.currentTime = targetTime;
      if (audio.paused) {
        audio.play().catch(() => {});
      }
      highlightSentence(index);
    }

    // ============================================================
    // 云端音频载入（页面打开即自动挂载 COS 上的 MP3）
    // ============================================================
    function initOnlineAudio() {
      audioDownloadLink.href = ONLINE_AUDIO_URL;
      audioFileName.textContent = `${ONLINE_AUDIO_NAME} · 云端在线`;
      audioLoadState.textContent = "（加载中…）";

      audio.src = ONLINE_AUDIO_URL;
      audio.load();
      isAudioLoaded = true;

      progressBar.max = TOTAL_AUDIO_DURATION;
      totalDurationDisplay.textContent = formatTime(TOTAL_AUDIO_DURATION);
    }

    // Upload & Audio Loading（本地文件作为可选替换源）
    uploadBtn.addEventListener('click', () => audioFileInput.click());
    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        loadAudioFile(file);
      }
    });

    function loadAudioFile(file) {
      const url = URL.createObjectURL(file);
      audio.src = url;
      audio.load();

      isAudioLoaded = true;
      audioFileName.textContent = `${file.name} · 本地导入`;
      audioFileName.classList.add('text-amber-900', 'font-bold');
      audioLoadState.textContent = "";
      uploadBtnText.textContent = "更换本地音频";
      showToast(`已切换为本地音频: ${file.name}`);

      audio.play().then(() => {
        updatePlayState(true);
      }).catch(() => {
        updatePlayState(false);
      });
    }

    function updatePlayState(playing) {
      if (playing) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
      }
    }

    playPauseBtn.addEventListener('click', () => {
      if (!isAudioLoaded) {
        showToast("音频尚未加载完成，请稍候…");
        return;
      }
      if (audio.paused) {
        audio.play();
        updatePlayState(true);
      } else {
        audio.pause();
        updatePlayState(false);
      }
    });

    audio.addEventListener('play', () => updatePlayState(true));
    audio.addEventListener('pause', () => updatePlayState(false));

    // 云端音频加载状态反馈
    audio.addEventListener('canplay', () => {
      audioLoadState.textContent = "";
    });
    audio.addEventListener('error', () => {
      audioLoadState.textContent = "（加载失败）";
      showToast("云端音频加载失败，请检查网络或改用本地音频");
    });

    skipBackBtn.addEventListener('click', () => {
      if (!isAudioLoaded) return;
      audio.currentTime = Math.max(0, audio.currentTime - 5);
    });

    skipForwardBtn.addEventListener('click', () => {
      if (!isAudioLoaded) return;
      audio.currentTime = Math.min(audio.duration || TOTAL_AUDIO_DURATION, audio.currentTime + 5);
    });

    // Single-sentence loop toggle
    singleLoopToggleBtn.addEventListener('click', () => {
      isSingleLoop = !isSingleLoop;
      if (isSingleLoop) {
        loopDot.classList.remove('bg-slate-400');
        loopDot.classList.add('bg-amber-600');
        loopText.textContent = "单句复读: 开";
        singleLoopToggleBtn.classList.add('bg-amber-600/20', 'border-amber-700', 'text-amber-900', 'font-bold');
        showToast("已开启当前单句循环复读");
      } else {
        loopDot.classList.add('bg-slate-400');
        loopDot.classList.remove('bg-amber-600');
        loopText.textContent = "单句复读: 关";
        singleLoopToggleBtn.classList.remove('bg-amber-600/20', 'border-amber-700', 'text-amber-900', 'font-bold');
        showToast("已关闭单句复读");
      }
    });

    // Speed toggle
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const speed = parseFloat(e.target.dataset.speed);
        audio.playbackRate = speed;
        document.querySelectorAll('.speed-btn').forEach(b => {
          b.className = "speed-btn px-2 py-1 rounded text-slate-700 hover:text-amber-900";
        });
        e.target.className = "speed-btn px-2 py-1 rounded bg-amber-600 text-white";
        showToast(`已设为 ${speed}x 播放速度`);
      });
    });

    // Audio time update synchronization
    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime;
      currentTimeDisplay.textContent = formatTime(cur);

      if (!isUserSeeking) {
        progressBar.value = cur;
      }

      // Sentence matching
      let activeIndex = -1;
      for (let i = 0; i < sentences.length; i++) {
        if (cur >= sentences[i].start && cur < sentences[i].end) {
          activeIndex = i;
          break;
        }
      }

      // Small pause retention
      if (activeIndex === -1 && currentSentenceIndex !== -1) {
        const last = sentences[currentSentenceIndex];
        if (cur >= last.end && cur < (sentences[currentSentenceIndex + 1]?.start || 999)) {
          activeIndex = currentSentenceIndex;
        }
      }

      // Handle single loop
      if (isSingleLoop && currentSentenceIndex !== -1) {
        const currentS = sentences[currentSentenceIndex];
        if (cur >= currentS.end) {
          audio.currentTime = currentS.start;
          return;
        }
      }

      if (activeIndex !== currentSentenceIndex) {
        highlightSentence(activeIndex);
      } else if (activeIndex !== -1) {
        // Calculate intra-sentence percentage for progress glow line
        const s = sentences[activeIndex];
        const pct = Math.min(100, Math.max(0, ((cur - s.start) / (s.end - s.start)) * 100));
        sentenceGlowFill.style.width = `${pct}%`;
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      progressBar.max = audio.duration || TOTAL_AUDIO_DURATION;
      totalDurationDisplay.textContent = formatTime(audio.duration || TOTAL_AUDIO_DURATION);
    });

    // Scrub bar events
    progressBar.addEventListener('mousedown', () => { isUserSeeking = true; });
    progressBar.addEventListener('touchstart', () => { isUserSeeking = true; });
    progressBar.addEventListener('input', (e) => {
      currentTimeDisplay.textContent = formatTime(parseFloat(e.target.value));
    });
    progressBar.addEventListener('change', (e) => {
      isUserSeeking = false;
      if (isAudioLoaded) {
        audio.currentTime = parseFloat(e.target.value);
      }
    });

    // Modal & Export System
    const transcriptModal = document.getElementById('transcriptModal');
    const openTranscriptBtn = document.getElementById('openTranscriptBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalTabSrt = document.getElementById('modalTabSrt');
    const modalTabTxt = document.getElementById('modalTabTxt');
    const modalTextarea = document.getElementById('modalTextarea');
    const copyModalContentBtn = document.getElementById('copyModalContentBtn');

    let currentModalMode = 'srt';

    function generateSrtString() {
      return sentences.map((s, i) => {
        return `${i + 1}\n${formatTimeSRT(s.start)} --> ${formatTimeSRT(s.end)}\n${s.text}\n`;
      }).join('\n');
    }

    function generateTxtString() {
      return sentences.map(s => `【第${String(s.id).padStart(2,'0')}句】${formatTime(s.start)} - ${formatTime(s.end)}\n${s.text}`).join('\n\n');
    }

    function updateModalContent() {
      if (currentModalMode === 'srt') {
        modalTextarea.value = generateSrtString();
        modalTabSrt.className = "px-3 py-1.5 text-xs font-bold text-amber-800 border-b-2 border-amber-700";
        modalTabTxt.className = "px-3 py-1.5 text-xs text-slate-600 hover:text-slate-900";
      } else {
        modalTextarea.value = generateTxtString();
        modalTabTxt.className = "px-3 py-1.5 text-xs font-bold text-amber-800 border-b-2 border-amber-700";
        modalTabSrt.className = "px-3 py-1.5 text-xs text-slate-600 hover:text-slate-900";
      }
    }

    openTranscriptBtn.addEventListener('click', () => {
      currentModalMode = 'srt';
      updateModalContent();
      transcriptModal.classList.remove('hidden');
      setTimeout(() => transcriptModal.classList.remove('opacity-0'), 10);
    });

    closeModalBtn.addEventListener('click', () => {
      transcriptModal.classList.add('opacity-0');
      setTimeout(() => transcriptModal.classList.add('hidden'), 250);
    });

    modalTabSrt.addEventListener('click', () => {
      currentModalMode = 'srt';
      updateModalContent();
    });

    modalTabTxt.addEventListener('click', () => {
      currentModalMode = 'txt';
      updateModalContent();
    });

    copyModalContentBtn.addEventListener('click', () => {
      const textToCopy = modalTextarea.value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          showToast("已成功复制到剪贴板！");
        }).catch(() => fallbackCopy(textToCopy));
      } else {
        fallbackCopy(textToCopy);
      }
    });

    function fallbackCopy(text) {
      const tempArea = document.createElement('textarea');
      tempArea.value = text;
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand('copy');
        showToast("已成功复制到剪贴板！");
      } catch (e) {
        showToast("复制失败，请手动全选复制");
      }
      document.body.removeChild(tempArea);
    }

    // Initialization on DOM Load
    window.addEventListener('DOMContentLoaded', () => {
      renderLyrics();
      initOnlineAudio();   // 自动挂载云端音频
      // Center the first sentence smoothly
      setTimeout(() => {
        scrollToActiveLyric(0, true);
      }, 100);
    });
  </script>
</body>
</html>
